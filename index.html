  <!-- The Rust crate, compiled to wasm32 and optimised for size. Rust ≥ 1.87 emits
       bulk-memory & friends by default, so wasm-opt must be told to accept them. -->
  <link data-trunk rel="rust" data-bin="nishank-os" data-wasm-opt="z"
        data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue">
  <link data-trunk rel="copy-dir" href="assets">

<body>
