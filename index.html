   ex:['[1,3] and [2,6] overlap, so they merge into [1,6].','[1,4] and [4,5] touch, so they merge.',null],
   tests:[[[[1,3],[2,6],[8,10],[15,18]]],[[[1,4],[4,5]]],[[[1,4],[0,4]]],[[[1,4],[2,3]]],[[[5,6],[1,2],[2,4]]],[[[2,3],[4,5],[6,7],[8,9],[1,10]]],[[[1,1]]]],visible:3,
   ref:iv=>{const a=iv.map(x=>[...x]).sort((x,y)=>x[0]-y[0]),o=[];for(const x of a){if(o.length&&x[0]<=o[o.length-1][1])o[o.length-1][1]=Math.max(o[o.length-1][1],x[1]);else o.push(x)}return o},
   sol:{py:`def merge(intervals):
    intervals.sort(key=lambda iv: iv[0])
    merged = []
    for start, end in intervals:
        if merged and start <= merged[-1][1]:
            merged[-1][1] = max(merged[-1][1], end)
        else:
            merged.append([start, end])
    return merged
`,js:`function merge(intervals) {
    intervals.sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const [start, end] of intervals) {
        const last = merged[merged.length - 1];
        if (last && start <= last[1]) last[1] = Math.max(last[1], end);
        else merged.push([start, end]);
    }
    return merged;
}
`}}
];
PROBLEMS.forEach(p=>{p.exp=p.tests.map(a=>p.ref(...JSON.parse(JSON.stringify(a))))});

const pyLit=v=>v===null||v===undefined?'None':typeof v==='boolean'?(v?'True':'False'):typeof v==='number'?String(v):typeof v==='string'?JSON.stringify(v):Array.isArray(v)?'['+v.map(pyLit).join(',')+']':'None';
const PY_TAIL=String.raw`
import time as __time
def __ser(x):
    if x is None:
        return "null"
    if isinstance(x, bool):
        return "true" if x else "false"
    if isinstance(x, (int, float)):
        return str(x)
    if isinstance(x, str):
        return '"' + x.replace('\\', '\\\\').replace('"', '\\"') + '"'
    if isinstance(x, (list, tuple)):
        return "[" + ",".join([__ser(i) for i in x]) + "]"
    return '"' + str(x) + '"'
__tests = %TESTS%
for __i in range(len(__tests)):
    print("@@S " + str(__i))
    try:
        __t = __time.time()
        __r = %FN%(*__tests[__i])
        print("@@R " + str(__i) + " " + str(int((__time.time() - __t) * 100000) / 100.0) + " " + __ser(__r))
    except Exception as __e:
        print("@@E " + str(__i) + " " + type(__e).__name__ + ": " + str(__e))
`;
function buildPy(code,fn,tests){
  const lit='['+tests.map(a=>'['+a.map(pyLit).join(',')+']').join(',')+']';
  return code.replace(/\s+$/,'')+'\n'+PY_TAIL.replace('%TESTS%',()=>lit).replace('%FN%',()=>fn);
}
function parsePy(buf,n){
  const res=Array.from({length:n},()=>null);let cur=-1;const pre=[];
  for(const line of buf.split('\n')){
    if(line.startsWith('@@S ')){cur=+line.slice(4);res[cur]={logs:[]};continue}
    if(line.startsWith('@@R ')){const m=line.match(/^@@R (\d+) (\S+) (.*)$/);const i=+m[1];let out;try{out=JSON.parse(m[3])}catch(e){out=m[3]}res[i]=Object.assign(res[i]||{logs:[]},{out,ms:+m[2]});continue}
    if(line.startsWith('@@E ')){const m=line.match(/^@@E (\d+) (.*)$/);const i=+m[1];res[i]=Object.assign(res[i]||{logs:[]},{err:m[2],ms:0});continue}
    if(cur>=0&&res[cur])res[cur].logs.push(line);else if(line)pre.push(line);
  }
  if(res[cur]&&res[cur].logs.length&&res[cur].logs[res[cur].logs.length-1]==='')res[cur].logs.pop();
  return {res,pre};
}
const deepEq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const judge=(p,i,r)=>!!r&&!r.err&&r.out!==undefined&&(p.cmp?p.cmp(r.out,p.exp[i]):deepEq(r.out,p.exp[i]));

/* ================= CODELAB ================= */
const CL={lang:'py',codes:{},solved:new Set()};
try{const s=JSON.parse(localStorage.getItem('kos.code')||'{}');CL.codes=s.codes||{};CL.solved=new Set(s.solved||[]);if(s.lang)CL.lang=s.lang}catch(e){}
const clSave=()=>{try{localStorage.setItem('kos.code',JSON.stringify({codes:CL.codes,solved:[...CL.solved],lang:CL.lang}))}catch(e){}};
const starter=(p,l)=>l==='py'?`def ${p.fn.py}(${p.params.join(', ')}):\n    # return ${p.ret}\n    pass\n`:`function ${p.fn.js}(${p.params.join(', ')}) {\n    // return ${p.ret}\n    \n}\n`;
const fmtVal=v=>{let s;try{s=v===undefined?'undefined':JSON.stringify(v)}catch(e){s=String(v)}return s.length>420?s.slice(0,420)+' … ('+s.length+' chars)':s};

let skLoad=null;
function loadSkulpt(){
  if(window.Sk&&window.Sk.builtinFiles)return Promise.resolve();
  if(skLoad)return skLoad;
  const add=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s)});
  skLoad=add('https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js').then(()=>add('https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js'));
  skLoad.catch(()=>{skLoad=null});
  return skLoad;
}
async function runPY(code,fn,tests,limit){
  await loadSkulpt();
  let buf='';const Sk=window.Sk;
  Sk.configure({output:t=>{buf+=t},read:x=>{if(!Sk.builtinFiles||!Sk.builtinFiles.files[x])throw "File not found: '"+x+"'";return Sk.builtinFiles.files[x]},__future__:Sk.python3,execLimit:limit,yieldLimit:100});
  let fatal=null;
  try{await Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody('<stdin>',false,buildPy(code,fn,tests),true))}catch(e){fatal=e}
  const {res,pre}=parsePy(buf,tests.length);
  if(fatal){
    const msg=String(fatal&&fatal.toString?fatal.toString():fatal);
    const type=/TimeLimitError/.test(msg)?'Time Limit Exceeded':/SyntaxError|IndentationError|TokenError|ParseError/.test(msg)?'Compile Error':'Runtime Error';
    return {error:{type,msg:type==='Time Limit Exceeded'?'Your code ran longer than '+limit/1000+' s. Check for an infinite loop or a slower-than-needed approach.':msg},res,pre};
  }
  return {res,pre};
}
let jsWorkerURL=null;
function runJS(code,fn,tests,limit){
  return new Promise(resolve=>{
    let w;
    try{if(!jsWorkerURL)jsWorkerURL=URL.createObjectURL(new Blob([$('#js-worker').textContent],{type:'text/javascript'}));w=new Worker(jsWorkerURL)}
    catch(e){ // fallback: main thread, no time limit
      try{const f=new Function(code+'\n;return typeof '+fn+'==="function"?'+fn+':null;')();if(!f)return resolve({error:{type:'Compile Error',msg:'Function '+fn+' is not defined. Keep the starter signature.'}});
        resolve({res:tests.map(a=>{const t0=performance.now();try{return{out:f(...JSON.parse(JSON.stringify(a))),ms:performance.now()-t0,logs:[]}}catch(err){return{err:String(err),ms:0,logs:[]}}})})}
      catch(err){resolve({error:{type:'Compile Error',msg:String(err)}})}
      return;
    }
    const t=setTimeout(()=>{w.terminate();resolve({error:{type:'Time Limit Exceeded',msg:'Your code ran longer than '+limit/1000+' s. Check for an infinite loop or a slower-than-needed approach.'}})},limit);
    w.onmessage=e=>{clearTimeout(t);w.terminate();const d=e.data;resolve(d.compileError?{error:{type:'Compile Error',msg:d.compileError}}:{res:d.res})};
    w.onerror=e=>{e.preventDefault();clearTimeout(t);w.terminate();resolve({error:{type:'Compile Error',msg:e.message||'Script error'}})};
    w.postMessage({code,fn,tests});
  });
}
function hlCode(code,lang){
  const KW=lang==='py'?PY_KW:JS_KW,BI=lang==='py'?PY_BI:JS_BI;
  const re=lang==='py'
    ?/(#.*$)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_]\w*\b)(?=\s*\()|(\b[A-Za-z_]\w*\b)/gm
    :/(\/\/.*$|\/\*[\s\S]*?\*\/)|(`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_$][\w$]*\b)(?=\s*\()|(\b[A-Za-z_$][\w$]*\b)/gm;
  let out='',last=0;
  code.replace(re,(m,c,s,n,f,w,off)=>{out+=esc(code.slice(last,off));last=off+m.length;
    const word=f||w;
    out+=c?`<span class="tk-c">${esc(m)}</span>`:s?`<span class="tk-s">${esc(m)}</span>`:n?`<span class="tk-n">${m}</span>`:KW.has(word)?`<span class="tk-k">${word}</span>`:BI.has(word)?`<span class="tk-b">${word}</span>`:f?`<span class="tk-f">${f}</span>`:esc(m);
    return m});
  return out+esc(code.slice(last))+'\n';
}
const PY_KW=new Set('def return if elif else for while in not and or is None True False pass break continue import from as class try except finally raise with lambda yield global nonlocal'.split(' '));
const PY_BI=new Set('len range enumerate max min sum sorted print list dict set tuple int str float abs zip map filter any all reversed isinstance self'.split(' '));
const JS_KW=new Set('function return if else for while of in const let var new true false null undefined break continue class try catch finally throw typeof instanceof this switch case default do'.split(' '));
const JS_BI=new Set('Math Map Set Array Object JSON String Number console length push pop shift'.split(' '));

function initCodeLab(body,rec,arg){
  let cur=PROBLEMS.find(p=>p.id===arg)||PROBLEMS[0];
  let ltab='desc',ctab='case',caseSel=0,last=null,busy=false;
  body.innerHTML=`<div class="cl">
   <section class="cl-left"><div class="cl-tabs"><button data-lt="desc">Description</button><button data-lt="list">Problems</button><span class="sp" id="cl-solved"></span></div><div class="cl-lbody"></div></section>
   <section class="cl-right">
    <div class="cl-tool"><select id="cl-lang" aria-label="Language"><option value="py">Python 3</option><option value="js">JavaScript</option></select>
      <button class="btn sm" id="cl-sol" title="Load Nishank's accepted solution">${ic('user')}Nishank's solution</button><button class="btn sm" id="cl-reset" title="Reset to starter code">${ic('reset')}Reset</button>
      <span style="flex:1"></span><button class="btn sm run" id="cl-run">${ic('play')}Run</button><button class="btn sm sub" id="cl-sub">${ic('upload')}Submit</button></div>
    <div class="ed"><div class="ed-gut" aria-hidden="true"></div><div class="ed-wrap"><pre class="ed-hl" aria-hidden="true"></pre><textarea class="ed-ta" id="cl-code" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code editor"></textarea></div></div>
    <div class="cl-con"><div class="cl-tabs"><button data-ct="case">Testcase</button><button data-ct="res">Test Result</button><span class="sp">Ctrl+Enter run · Ctrl+Shift+Enter submit</span></div><div class="cl-cbody"></div></div>
   </section></div>`;
  const lb=$('.cl-lbody',body),cb=$('.cl-cbody',body),ta=$('#cl-code',body),hl=$('.ed-hl',body),gut=$('.ed-gut',body),langSel=$('#cl-lang',body);
  const key=()=>cur.id+':'+CL.lang;
  function paint(){hl.innerHTML=hlCode(ta.value,CL.lang);const n=ta.value.split('\n').length;let g='';for(let i=1;i<=n;i++)g+=i+'\n';gut.textContent=g;sync()}
  function sync(){hl.scrollTop=ta.scrollTop;hl.scrollLeft=ta.scrollLeft;gut.scrollTop=ta.scrollTop}
  function loadCode(){ta.value=CL.codes[key()]??starter(cur,CL.lang);paint()}
  ta.addEventListener('input',()=>{CL.codes[key()]=ta.value;clSave();paint()});
  ta.addEventListener('scroll',sync);
  const del=()=>{ta.focus();if(!document.execCommand||!document.execCommand('delete')){ta.setRangeText('',ta.selectionStart,ta.selectionEnd,'end');ta.dispatchEvent(new Event('input'))}};
  const insert=t=>{ta.focus();if(!document.execCommand||!document.execCommand('insertText',false,t)){ta.setRangeText(t,ta.selectionStart,ta.selectionEnd,'end');ta.dispatchEvent(new Event('input'))}};
  ta.addEventListener('keydown',e=>{
    const v=ta.value,ss=ta.selectionStart,se=ta.selectionEnd;
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();exec(e.shiftKey);return}
    if(e.key==='Tab'){e.preventDefault();
      const ls=v.lastIndexOf('\n',ss-1)+1;
      if(e.shiftKey||v.slice(ss,se).includes('\n')){
        const endPos=se>ss&&v[se-1]==='\n'?se-1:se;let le=v.indexOf('\n',endPos);if(le===-1)le=v.length;
        const block=v.slice(ls,le);const nb=block.split('\n').map(l=>e.shiftKey?l.replace(/^ {1,4}/,''):'    '+l).join('\n');
        ta.setSelectionRange(ls,le);insert(nb);ta.setSelectionRange(ls,ls+nb.length);
      }else insert('    ');
      return}
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();
      const ls=v.lastIndexOf('\n',ss-1)+1,line=v.slice(ls,ss),ind=line.match(/^\s*/)[0];
      const prev=line.trimEnd().slice(-1),next=v[se];
      const open=CL.lang==='py'?prev===':':'{(['.includes(prev);
      if(open&&CL.lang==='js'&&'})]'.includes(next||'')){insert('\n'+ind+'    \n'+ind);const p=ss+1+ind.length+4;ta.setSelectionRange(p,p)}
      else insert('\n'+ind+(open?'    ':''));
      return}
    if(e.key==='Backspace'&&ss===se){const ls=v.lastIndexOf('\n',ss-1)+1,before=v.slice(ls,ss);if(before.length&&/^ +$/.test(before)){e.preventDefault();const n=before.length%4||4;ta.setSelectionRange(ss-n,ss);del()}}
    if(e.key==='}'&&CL.lang==='js'){const ls=v.lastIndexOf('\n',ss-1)+1,before=v.slice(ls,ss);if(/^ {4,}$/.test(before)&&ss===se){e.preventDefault();ta.setSelectionRange(ss-4,ss);insert('}')}}
  });
  function renderLeft(){
    $$('[data-lt]',body).forEach(b=>b.classList.toggle('on',b.dataset.lt===ltab));
    $('#cl-solved',body).textContent=`solved ${PROBLEMS.filter(p=>CL.solved.has(p.id)).length} / ${PROBLEMS.length}`;
    if(ltab==='list'){
      lb.innerHTML=`<div class="pl">${PROBLEMS.map(p=>`<button data-pid="${p.id}" class="${p.id===cur.id?'on':''}">${CL.solved.has(p.id)?ic('check','ic st-ic'):'<i class="st-no"></i>'}<span><b style="font-weight:500">${p.n}. ${esc(p.title)}</b><small>${p.tags.map(esc).join(' · ')}</small></span><span class="diff ${p.diff}">${p.diff}</span></button>`).join('')}</div>`;
      return}
    const ex=cur.tests.slice(0,cur.visible).map((a,i)=>`<div class="ex"><b>Example ${i+1}</b><pre><span>Input:</span> ${cur.params.map((n,j)=>`${n} = ${esc(fmtVal(a[j]))}`).join(', ')}\n<span>Output:</span> ${esc(fmtVal(cur.exp[i]))}${cur.ex&&cur.ex[i]?`\n<span>Explanation:</span> ${esc(cur.ex[i])}`:''}</pre></div>`).join('');
    lb.innerHTML=`<h2 class="cl-title">${cur.n}. ${esc(cur.title)}</h2>
      <div class="cl-meta"><span class="diff ${cur.diff}">${cur.diff}</span>${cur.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}${CL.solved.has(cur.id)?`<span class="chip" style="color:var(--ok);border-color:rgba(69,216,147,.35);background:rgba(69,216,147,.1)">✓ Solved</span>`:''}</div>
      <div class="cl-desc">${cur.desc}</div>${ex}
      <h4>Constraints</h4><ul class="cons">${cur.cons.map(c=>`<li><code>${esc(c)}</code></li>`).join('')}</ul>
      ${cur.follow?`<h4>Follow-up</h4><p class="muted" style="margin:0;font-size:13px">${esc(cur.follow)}</p>`:''}
      <p class="muted" style="margin:18px 0 0;font:11.5px var(--mono)">${cur.tests.length} test cases · ${cur.tests.length-cur.visible} hidden</p>`;
  }
  function renderCon(){
    $$('[data-ct]',body).forEach(b=>b.classList.toggle('on',b.dataset.ct===ctab));
    if(busy){cb.innerHTML=`<div class="cl-pending"><span class="spin"></span>${busy}</div>`;return}
    if(ctab==='case'){
      const vis=cur.tests.slice(0,cur.visible);if(caseSel>=vis.length)caseSel=0;
      cb.innerHTML=`<div class="cases">${vis.map((_,i)=>`<button data-case="${i}" class="${i===caseSel?'on':''}">Case ${i+1}</button>`).join('')}</div>
        <div class="io">${cur.params.map((n,j)=>`<div><label>${n} =</label><pre>${esc(fmtVal(vis[caseSel][j]))}</pre></div>`).join('')}</div>`;
      return}
    if(!last){cb.innerHTML='<p class="muted" style="margin:0">Run your code to see results here.</p>';return}
    const {r,submit,tests}=last;
    if(r.error&&(!r.res||r.res.every(x=>!x))){cb.innerHTML=`<div class="verdict-h"><span class="${r.error.type==='Time Limit Exceeded'?'v-warn':'v-bad'}">${r.error.type}</span></div><pre class="err-pre">${esc(r.error.msg)}</pre>`;return}
    const res=r.res||[];const pass=tests.map((_,i)=>judge(cur,i,res[i]));
    const firstBad=pass.findIndex(x=>!x);const errCase=res.find(x=>x&&x.err);
    const ms=res.reduce((s,x)=>s+(x&&x.ms||0),0);
    let verdict,cls;
    if(r.error){verdict=r.error.type;cls=r.error.type==='Time Limit Exceeded'?'v-warn':'v-bad'}
    else if(firstBad===-1){verdict='Accepted';cls='v-ok'}
    else if(errCase){verdict='Runtime Error';cls='v-bad'}
    else{verdict='Wrong Answer';cls='v-bad'}
    const caseBox=i=>{const x=res[i]||{};return `<div class="io">${cur.params.map((n,j)=>`<div><label>${n} =</label><pre>${esc(fmtVal(tests[i][j]))}</pre></div>`).join('')}
      ${x.logs&&x.logs.length?`<div><label>Stdout</label><pre>${esc(x.logs.join('\n'))}</pre></div>`:''}
      ${x.err?`<div><label>Error</label><pre class="err-pre">${esc(x.err)}</pre></div>`:`<div><label>Output</label><pre style="color:${pass[i]?'var(--ink)':'#ffb3bd'}">${res[i]?esc(fmtVal(x.out)):'(not reached)'}</pre></div>`}
      <div><label>Expected</label><pre>${esc(fmtVal(cur.exp[i]))}</pre></div></div>`};
    if(submit){
      const passed=pass.filter(Boolean).length;
      cb.innerHTML=`<div class="verdict-h"><span class="${cls}">${verdict}</span><small>${passed} / ${tests.length} testcases passed${firstBad===-1?` · runtime ${ms.toFixed(2)} ms · ${CL.lang==='py'?'Python 3':'JavaScript'}`:''}</small></div>
        ${r.error?`<pre class="err-pre" style="margin-bottom:10px">${esc(r.error.msg)}</pre>`:''}
        ${firstBad===-1?`<p class="muted" style="margin:0">All ${tests.length} cases pass, including ${tests.length-cur.visible} hidden ones. ${PROBLEMS.find(p=>!CL.solved.has(p.id))?'Try the next problem from the Problems tab.':'Every problem is solved. Nice work.'}</p>`:`<p class="muted" style="margin:0 0 8px">Failed on case ${firstBad+1}${firstBad>=cur.visible?' (hidden)':''}:</p>${caseBox(firstBad)}`}`;
      return}
    if(caseSel>=tests.length)caseSel=0;
    cb.innerHTML=`<div class="verdict-h"><span class="${cls}">${verdict}</span><small>runtime ${ms.toFixed(2)} ms</small></div>
      ${r.error?`<pre class="err-pre" style="margin-bottom:10px">${esc(r.error.msg)}</pre>`:''}
      <div class="cases">${tests.map((_,i)=>`<button data-case="${i}" class="${i===caseSel?'on':''}"><i class="${pass[i]?'':'f'}"></i>Case ${i+1}</button>`).join('')}</div>${caseBox(caseSel)}`;
  }
  async function exec(submit){
    if(busy)return;
    const tests=submit?cur.tests:cur.tests.slice(0,cur.visible);
    ctab='res';
    busy=CL.lang==='py'&&!(window.Sk&&window.Sk.builtinFiles)?'Loading the Python runtime (first run only)…':submit?'Judging against all test cases…':'Running…';
    $('#cl-run',body).disabled=$('#cl-sub',body).disabled=true;renderCon();
    let r;const limit=submit?8000:5000;
    try{r=CL.lang==='py'?await runPY(ta.value,cur.fn.py,tests,limit):await runJS(ta.value,cur.fn.js,tests,limit)}
    catch(err){r={error:{type:'Runtime Unavailable',msg:'The Python runtime could not load. Check your connection, or switch to JavaScript, which runs offline.'}}}
    busy=false;$('#cl-run',body).disabled=$('#cl-sub',body).disabled=false;
    last={r,submit,tests};caseSel=0;
    if(submit&&!r.error&&tests.every((_,i)=>judge(cur,i,r.res[i]))&&!CL.solved.has(cur.id)){CL.solved.add(cur.id);clSave();renderLeft();toast('Accepted',`${cur.n}. ${cur.title} solved in ${CL.lang==='py'?'Python':'JavaScript'}.`,'check')}
    renderCon();
  }
  function selectProblem(id){cur=PROBLEMS.find(p=>p.id===id)||cur;ltab='desc';ctab='case';last=null;caseSel=0;loadCode();renderLeft();renderCon()}
  body.addEventListener('click',e=>{
    const t=e.target.closest('[data-lt],[data-ct],[data-case],[data-pid]');if(!t)return;
    if(t.dataset.lt){ltab=t.dataset.lt;renderLeft()}
    else if(t.dataset.ct){ctab=t.dataset.ct;renderCon()}
    else if(t.dataset.case){caseSel=+t.dataset.case;renderCon()}
    else if(t.dataset.pid)selectProblem(t.dataset.pid);
  });
  langSel.value=CL.lang;
  langSel.addEventListener('change',()=>{CL.lang=langSel.value;clSave();last=null;loadCode();renderCon();if(CL.lang==='py')loadSkulpt().catch(()=>{})});
  $('#cl-run',body).onclick=()=>exec(false);$('#cl-sub',body).onclick=()=>exec(true);
  $('#cl-reset',body).onclick=()=>{ta.value=starter(cur,CL.lang);delete CL.codes[key()];clSave();paint();ta.focus()};
  $('#cl-sol',body).onclick=()=>{ta.value=cur.sol[CL.lang];CL.codes[key()]=ta.value;clSave();paint()};
  loadCode();renderLeft();renderCon();
  if(CL.lang==='py')loadSkulpt().catch(()=>{});
  return {arg:id=>selectProblem(id)};
}
