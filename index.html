<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Nishank Khadpe: AI & Data Science undergrad building secure, real-time AI systems. A Kali-inspired desktop portfolio.">
<meta name="theme-color" content="#040a15">
<meta property="og:title" content="KhadpeOS · Nishank Khadpe">
<meta property="og:description" content="A Kali-inspired desktop portfolio: terminal, CodeLab, Cypheron scanner, AvIAI radar, Fintrix RAG.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233d8bff' stroke-width='2' stroke-linejoin='round'%3E%3Cpath d='M12 1.8l9 5.1v10.2l-9 5.1-9-5.1V6.9z'/%3E%3Cpath d='M8.2 16.2V7.8l7.6 8.4V7.8'/%3E%3C/svg%3E">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>KhadpeOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a single-screen desktop OS. Top Xfce-style panel, wallpaper canvas, desktop icons, draggable glass windows. Deliberately dark-only. */
:root{
  --void:#040a15; --deep:#081224; --glass:rgba(9,19,38,.9); --glass2:rgba(17,33,62,.72);
  --line:#16304f; --line2:#24497c;
  --ink:#dce8f8; --mute:#8ba2c3; --dim:#5a739b;
  --blue:#3d8bff; --ice:#72d6ff; --blueSoft:rgba(61,139,255,.14);
  --ok:#45d893; --warn:#ffb84d; --high:#ff8a4c; --crit:#ff5c70;
  --display:'Chakra Petch', ui-sans-serif, system-ui, sans-serif;
  --sans:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font:14px/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--ice)}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
svg{display:block}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- boot / lock ---------- */
#boot,#lock{position:fixed;inset:0;z-index:20000;background:var(--void);display:flex;flex-direction:column}
#boot{padding:24px 20px;font:13px/1.55 var(--mono);color:var(--mute);overflow:hidden;transition:opacity .45s}
#boot.out{opacity:0;pointer-events:none}
#boot .ok{color:var(--ok)} #boot .hl{color:var(--ice)}
#boot .skip{position:absolute;right:18px;bottom:16px;color:var(--dim);font-size:12px}
#lock{align-items:center;justify-content:center;gap:10px;cursor:pointer;
  background:radial-gradient(ellipse at 50% 35%,#0d2348 0%,var(--void) 65%)}
#lock .lk-time{font:600 clamp(56px,14vw,112px)/1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
#lock .lk-date{color:var(--mute);font-size:16px}
#lock .lk-user{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:8px}
#lock .lk-hint{color:var(--dim);font:12px var(--mono);margin-top:10px}

/* ---------- shell ---------- */
#os{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column}
.panel{height:36px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px;background:rgba(4,10,22,.94);border-bottom:1px solid var(--line);position:relative;z-index:9000}
.pbtn{height:28px;min-width:28px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 7px;border-radius:5px;color:var(--mute)}
.pbtn:hover{background:var(--blueSoft);color:var(--ink)}
.pbtn.brand{color:var(--blue);padding:0 9px 0 6px}
.pbtn.brand b{font:600 13px var(--display);letter-spacing:.06em;color:var(--ink)}
.psep{width:1px;height:18px;background:var(--line);margin:0 4px;flex:none}
.tasks{display:flex;gap:3px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tasks::-webkit-scrollbar{display:none}
.task{height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:5px;font-size:12.5px;color:var(--mute);white-space:nowrap;border:1px solid transparent;flex:none;max-width:200px}
.task span{overflow:hidden;text-overflow:ellipsis}
.task .ic{width:15px;height:15px}
.task:hover{background:var(--blueSoft);color:var(--ink)}
.task.on{background:rgba(61,139,255,.2);border-color:var(--line2);color:var(--ink)}
.task.min{opacity:.6}
.tray{display:flex;align-items:center;gap:2px;color:var(--mute);flex:none}
.clock{font:500 12.5px var(--mono);padding:0 8px;font-variant-numeric:tabular-nums;color:var(--ink)}
#desk{position:relative;flex:1;overflow:hidden;background:radial-gradient(ellipse at 70% 30%,#0b1e3e 0%,var(--deep) 45%,var(--void) 100%)}
#wall{position:absolute;inset:0;width:100%;height:100%}
.sigil-bg{position:absolute;right:6%;top:50%;transform:translateY(-50%);width:min(38vw,440px);opacity:.09;color:var(--blue);pointer-events:none}
.sigil-bg svg{width:100%;height:auto}
.wall-tag{position:absolute;right:20px;bottom:14px;font:12px var(--mono);color:var(--dim);pointer-events:none;text-align:right}
.wall-tag b{display:block;font:600 22px var(--display);color:rgba(220,232,248,.28);letter-spacing:.08em}

/* desktop icons */
.icons{position:absolute;left:16px;top:16px;bottom:16px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,88px);grid-auto-columns:88px;gap:6px 8px}
.dicon{width:88px;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;border-radius:8px;padding:6px 4px;text-align:center;font-size:12px;line-height:1.2;color:var(--ink);text-shadow:0 1px 3px #000}
.dicon .ic{width:30px;height:30px;stroke-width:1.4;color:var(--ice);filter:drop-shadow(0 0 8px rgba(61,139,255,.45))}
.dicon:hover,.dicon:focus-visible{background:rgba(61,139,255,.16)}

/* windows */
.win{position:absolute;display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line2);border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4);overflow:hidden;resize:both;min-width:300px;min-height:220px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);animation:winIn .18s ease-out}
.win.focused{border-color:rgba(61,139,255,.75);box-shadow:0 28px 70px rgba(0,0,0,.6),0 0 0 1px rgba(61,139,255,.25),0 0 40px rgba(61,139,255,.12)}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;resize:none}
@keyframes winIn{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.tb{height:36px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;background:linear-gradient(#0f2140,#0b1932);border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none}
.tb:active{cursor:grabbing}
.tb-ic .ic{width:15px;height:15px;color:var(--blue)}
.tb-t{flex:1;min-width:0;font:600 13px var(--display);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-b{display:flex;gap:4px}
.tb-b button{width:26px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--mute)}
.tb-b button .ic{width:14px;height:14px}
.tb-b button:hover{background:rgba(255,255,255,.08);color:var(--ink)}
.tb-b button.x:hover{background:var(--crit);color:#fff}
.wb{flex:1;min-height:0;overflow:auto;position:relative}

/* menu */
#menu{position:absolute;left:6px;top:40px;width:min(380px,calc(100vw - 12px));max-height:calc(100% - 50px);background:rgba(7,15,30,.97);border:1px solid var(--line2);border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.6);z-index:9500;display:flex;flex-direction:column;overflow:hidden}
.m-head{display:flex;gap:12px;align-items:center;padding:14px 14px 10px}
.m-head .who b{display:block;font:600 15px var(--display)}
.m-head .who span{color:var(--mute);font-size:12px}
.m-search{margin:0 12px 8px;display:flex;align-items:center;gap:8px;padding:0 10px;height:34px;border:1px solid var(--line2);border-radius:7px;background:var(--deep)}
.m-search input{flex:1;background:none;border:0;outline:0;min-width:0}
.m-list{overflow:auto;padding:4px 6px 8px}
.m-item{width:100%;display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:7px;text-align:left}
.m-item:hover,.m-item:focus-visible{background:var(--blueSoft)}
.m-item .ic{width:20px;height:20px;color:var(--ice);flex:none}
.m-item b{display:block;font-weight:500}
.m-item small{color:var(--mute);font-size:12px}
.m-foot{display:flex;gap:6px;justify-content:flex-end;padding:8px 10px;border-top:1px solid var(--line)}
.m-foot button{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;color:var(--mute);font-size:12.5px}
.m-foot button:hover{background:var(--blueSoft);color:var(--ink)}
#ctx{position:absolute;z-index:9600;min-width:210px;background:rgba(7,15,30,.97);border:1px solid var(--line2);border-radius:8px;padding:5px;box-shadow:0 16px 40px rgba(0,0,0,.6)}
#ctx button{width:100%;text-align:left;padding:7px 10px;border-radius:5px;font-size:13px;display:flex;justify-content:space-between;gap:16px}
#ctx button:hover{background:var(--blueSoft)}
#ctx kbd{font:11px var(--mono);color:var(--dim)}
#ctx hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.toasts{position:absolute;right:12px;top:10px;display:flex;flex-direction:column;gap:8px;z-index:9400;width:min(330px,calc(100% - 24px))}
.toast{display:flex;gap:12px;padding:12px 14px;background:rgba(8,17,34,.97);border:1px solid var(--line2);border-radius:9px;box-shadow:0 14px 36px rgba(0,0,0,.5);animation:toastIn .3s ease-out;cursor:pointer}
.toast .ic{width:22px;height:22px;color:var(--warn);flex:none;margin-top:2px}
.toast b{display:block;font:600 13.5px var(--display);letter-spacing:.03em}
.toast span{color:var(--mute);font-size:12.5px}
@keyframes toastIn{from{transform:translateX(30px);opacity:0}}

/* sigil avatar */
.av-hex{width:48px;height:48px;color:var(--blue);flex:none}
.av-hex svg{width:100%;height:100%}

/* ---------- shared bits ---------- */
.pad{padding:18px 20px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.h1{font:600 26px/1.15 var(--display);letter-spacing:.01em;text-wrap:balance;margin:2px 0 4px}
.h2{font:600 17px/1.25 var(--display);letter-spacing:.02em;margin:0;text-wrap:balance}
.muted{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 11.5px var(--mono);padding:3px 8px;border-radius:4px;background:var(--blueSoft);color:#b8d3ff;border:1px solid rgba(61,139,255,.25);white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:6px;border:1px solid var(--line2);background:var(--glass2);font-size:13px;font-weight:500}
.btn:hover{border-color:var(--blue);background:rgba(61,139,255,.2)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#04101f}
.btn.pri:hover{background:#5a9dff}
.btn .ic{width:15px;height:15px}
.demo-note{font:11.5px var(--mono);color:var(--dim);margin:0;padding:8px 14px;border-top:1px solid var(--line);background:rgba(4,10,22,.5)}
.sev{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.sev.critical{background:rgba(255,92,112,.18);color:var(--crit)}
.sev.high{background:rgba(255,138,76,.16);color:var(--high)}
.sev.medium{background:rgba(255,184,77,.15);color:var(--warn)}
.sev.low{background:rgba(114,214,255,.12);color:var(--ice)}
.sev.info{background:rgba(139,162,195,.14);color:var(--mute)}
.sev.ok{background:rgba(69,216,147,.15);color:var(--ok)}
.split{display:grid;grid-template-columns:minmax(200px,260px) 1fr;height:100%;min-height:0}
.split>*{min-width:0;min-height:0;overflow:auto}
.side{border-right:1px solid var(--line);background:rgba(4,10,22,.45);padding:10px}
.row-btn{width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:7px;border:1px solid transparent}
.row-btn:hover{background:rgba(61,139,255,.08)}
.row-btn.sel{background:rgba(61,139,255,.16);border-color:var(--line2)}
.row-btn .ic{width:18px;height:18px;color:var(--ice);flex:none;margin-top:2px}
.row-btn b{display:block;font-weight:500;font-size:13.5px}
.row-btn small{display:block;color:var(--mute);font-size:12px;line-height:1.35}
.side h5{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:10px 10px 6px}
ul.pts{margin:0;padding:0;list-style:none;display:grid;gap:8px}
ul.pts li{position:relative;padding-left:18px;max-width:68ch}
ul.pts li::before{content:'›';position:absolute;left:3px;color:var(--blue);font-weight:700}

/* ---------- terminal ---------- */
.term{background:rgba(3,8,18,.92);font:13px/1.55 var(--mono);padding:10px 14px 14px;cursor:text}
.t-out>div{white-space:pre-wrap;word-break:break-word}
.t-b{color:var(--blue)} .t-u{color:var(--ice);font-weight:600} .t-d{color:var(--ink);font-weight:600}
.t-g{color:var(--ok)} .t-y{color:var(--warn)} .t-r{color:var(--crit)} .t-m{color:var(--mute)}
.t-in{display:flex;flex-direction:column}
.t-in .ln{display:flex;align-items:center}
.t-in input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:13px var(--mono);padding:0 0 0 8px;min-width:0;caret-color:var(--ice)}
.t-link{color:var(--ice);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.t-link:hover{color:#fff}
.nf{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:flex-start}
.nf pre{margin:0;color:var(--blue);font:12px/1.2 var(--mono)}
.nf .sw{display:inline-block;width:18px;height:10px;margin-right:2px}
.t-tbl{display:grid;grid-template-columns:auto auto 1fr;gap:0 18px}

/* ---------- about ---------- */
.ab-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ab-head .av-hex{width:72px;height:72px}
.focus{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0}
.fcard{padding:12px 13px;border:1px solid var(--line);border-radius:8px;background:rgba(4,10,22,.4);text-align:left;display:flex;flex-direction:column;gap:6px}
.fcard:hover{border-color:var(--line2);background:rgba(61,139,255,.07)}
.fcard .ic{width:20px;height:20px;color:var(--ice)}
.fcard b{font:600 14px var(--display);letter-spacing:.02em}
.fcard span{color:var(--mute);font-size:12.5px;line-height:1.4}
.fcard em{font:normal 11.5px var(--mono);color:var(--blue);margin-top:auto}
.edu{display:grid;gap:0;margin-top:6px}
.edu>div{display:grid;grid-template-columns:96px 1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.edu .yr{font:12px var(--mono);color:var(--dim)}
.edu .sc{font:600 13px var(--mono);color:var(--ice);font-variant-numeric:tabular-nums}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px}
.stats div b{display:block;font:600 22px var(--display);color:var(--ink)}
.stats div span{font:11px var(--mono);color:var(--dim);letter-spacing:.06em;text-transform:uppercase}

/* ---------- projects ---------- */
.pj-det{padding:20px 22px;display:grid;gap:14px;align-content:start}
.pj-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font:12px var(--mono);color:var(--dim)}
.pj-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- cypheron ---------- */
.cy{display:flex;flex-direction:column;height:100%}
.cy-bar{display:flex;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cy-url{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:6px;background:var(--deep);font:13px var(--mono)}
.cy-url input{flex:1;background:none;border:0;outline:0;min-width:0}
.cy-url .ic{width:15px;height:15px;color:var(--ok)}
.cy-main{flex:1;min-height:0;display:grid;grid-template-columns:240px 1fr}
.cy-main>*{min-width:0;min-height:0;overflow:auto}
.cy-left{border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:14px}
.grade{display:flex;gap:14px;align-items:center}
.grade-l{width:72px;height:72px;border-radius:10px;display:grid;place-items:center;font:700 40px var(--display);border:2px solid currentColor;flex:none}
.grade small{display:block;font:11px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
.grade b{font:600 24px var(--display);font-variant-numeric:tabular-nums}
.mods{display:grid;gap:5px}
.mod{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12.5px}
.mod i{grid-column:1/-1;height:3px;border-radius:2px;background:var(--line);overflow:hidden;display:block}
.mod i::after{content:'';display:block;height:100%;width:var(--p,0%);background:var(--blue);transition:width .25s}
.mod.done i::after{background:var(--ok)}
.mod em{font:normal 11px var(--mono);color:var(--dim)}
.counts{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.counts div{padding:6px 0;border-radius:5px;background:rgba(4,10,22,.5)}
.counts b{display:block;font:600 16px var(--display)}
.counts span{font:9.5px var(--mono);text-transform:uppercase;color:var(--dim)}
.cy-right{padding:14px;display:grid;gap:12px;align-content:start}
.ai-box{border:1px solid var(--line2);border-radius:8px;padding:12px 14px;background:linear-gradient(135deg,rgba(61,139,255,.1),rgba(114,214,255,.03))}
.ai-box .eyebrow{display:flex;align-items:center;gap:6px}
.ai-box p{margin:6px 0 0;max-width:72ch}
.finding{border:1px solid var(--line);border-radius:8px;background:rgba(4,10,22,.35);overflow:hidden}
.finding summary{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;list-style:none}
.finding summary::-webkit-details-marker{display:none}
.finding summary b{flex:1;font-weight:500;font-size:13px;min-width:0}
.finding summary em{font:normal 11px var(--mono);color:var(--dim)}
.finding .fd{padding:0 12px 12px;font-size:13px;color:var(--mute);display:grid;gap:6px}
.finding .fd code{font:12px var(--mono);color:var(--ice)}
.cy-log{font:11.5px/1.6 var(--mono);color:var(--dim);background:rgba(3,8,18,.7);border-radius:6px;padding:8px 10px;max-height:150px;overflow:auto}
.cy-log .g{color:var(--ok)}

/* ---------- aviai ---------- */
.av{display:grid;grid-template-columns:1fr 280px;height:calc(100% - 33px);min-height:0}
.av>*{min-width:0;min-height:0}
.av-scope{position:relative;background:#020812;display:grid;place-items:center;overflow:hidden}
.av-scope canvas{width:100%;height:100%}
.av-hud{position:absolute;left:10px;top:8px;font:11.5px var(--mono);color:var(--ice);letter-spacing:.06em}
.av-side{border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.av-side h4{margin:0;padding:10px 12px 6px;font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.av-strips{padding:0 8px;display:grid;gap:4px;max-height:42%;overflow:auto}
.strip{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font:11.5px var(--mono);padding:5px 8px;border-radius:4px;background:rgba(61,139,255,.07);border-left:3px solid var(--blue)}
.strip.dep{border-left-color:var(--ok)}
.strip b{color:var(--ink)} .strip span{color:var(--dim);font-variant-numeric:tabular-nums}
.av-log{list-style:none;margin:0;padding:0 12px 10px;overflow:auto;flex:1;font:11.5px/1.5 var(--mono);display:grid;gap:8px;align-content:start}
.av-log li{color:var(--mute);animation:toastIn .25s}
.av-log li b{color:var(--ice);font-weight:600}
.av-log li time{color:var(--dim);display:block;font-size:10.5px}

/* ---------- fintrix ---------- */
.fx{display:grid;grid-template-columns:1fr 290px;height:100%;min-height:0}
.fx>*{min-width:0;min-height:0;overflow:auto}
.fx-main{padding:14px;display:grid;gap:12px;align-content:start}
.fx-q{display:flex;gap:8px}
.fx-q input{flex:1;min-width:0;height:36px;padding:0 12px;border:1px solid var(--line2);border-radius:6px;background:var(--deep);outline:0}
.fx-q input:focus{border-color:var(--blue)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{font-size:12px;padding:4px 10px;border-radius:14px;border:1px solid var(--line);color:var(--mute)}
.sugg button:hover{border-color:var(--blue);color:var(--ink)}
.pipe{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font:11px var(--mono);color:var(--dim)}
.pipe span{padding:3px 8px;border:1px solid var(--line);border-radius:4px}
.pipe span.on{border-color:var(--blue);color:var(--ice);background:var(--blueSoft)}
.ans{border:1px solid var(--line2);border-radius:8px;padding:12px 14px;background:rgba(61,139,255,.06)}
.ans p{margin:4px 0 8px;max-width:70ch}
.ans .src{font:11.5px var(--mono);color:var(--ice)}
.ans.miss{border-color:rgba(255,184,77,.4);background:rgba(255,184,77,.05)}
.ret{width:100%;border-collapse:collapse;font-size:12.5px}
.ret th{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.ret td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ret td.n{font:12px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ret .bar{height:4px;background:var(--line);border-radius:2px;margin-top:4px;width:70px}
.ret .bar i{display:block;height:100%;background:var(--blue);border-radius:2px}
.ret tr.top td{background:rgba(61,139,255,.07)}
.fx-side{border-left:1px solid var(--line);padding:14px;display:grid;gap:12px;align-content:start;background:rgba(4,10,22,.4)}
.fld{display:grid;gap:4px;font-size:12.5px}
.fld label{color:var(--mute);display:flex;justify-content:space-between}
.fld label output{font:12px var(--mono);color:var(--ink)}
.fld input[type=range]{width:100%;accent-color:var(--blue)}
.fld select{height:32px;border-radius:6px;border:1px solid var(--line2);background:var(--deep);padding:0 8px}
.meter{height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:5px;transition:width .2s,background .2s}
.verdict{border-radius:8px;padding:10px 12px;font-size:12.5px;border:1px solid var(--line)}
.verdict b{display:flex;align-items:center;gap:8px;margin-bottom:4px}

/* ---------- blueprints ---------- */
.bp{display:flex;flex-direction:column;height:100%}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tab{padding:7px 14px;border-radius:6px 6px 0 0;font:500 13px var(--display);letter-spacing:.04em;color:var(--mute);border:1px solid transparent;border-bottom:0;white-space:nowrap}
.tab.on{background:rgba(61,139,255,.12);color:var(--ink);border-color:var(--line)}
.bp-body{flex:1;min-height:0;overflow:auto;padding:14px;display:grid;gap:12px;align-content:start;
  background-image:linear-gradient(rgba(61,139,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(61,139,255,.06) 1px,transparent 1px);background-size:24px 24px}
.diagram{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:rgba(3,8,18,.6)}
.diagram svg{min-width:760px;width:100%;height:auto}
.dg-node rect{fill:#0c1c36;stroke:var(--line2);stroke-width:1.2}
.dg-node.k-ext rect{fill:#0a1424;stroke:#3a5478;stroke-dasharray:4 3}
.dg-node.k-ai rect{fill:#0f2547;stroke:var(--blue)}
.dg-node.k-db rect{fill:#0b1d2c;stroke:#2f6d80}
.dg-node text{font-family:var(--mono);fill:var(--ink);font-size:12px}
.dg-node text.s{fill:var(--mute);font-size:10px}
.dg-edge{fill:none;stroke:var(--blue);stroke-width:1.4;stroke-dasharray:5 5;opacity:.85;animation:flow 1.2s linear infinite}
.dg-lbl{font-family:var(--mono);font-size:9.5px;fill:var(--ice)}
@keyframes flow{to{stroke-dashoffset:-20}}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.note{padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:rgba(4,10,22,.75)}
.note b{display:block;font:600 13px var(--display);letter-spacing:.03em;margin-bottom:3px;color:var(--ice)}
.note span{color:var(--mute);font-size:12.5px}

/* ---------- packages ---------- */
.pk{display:flex;flex-direction:column;height:100%}
.pk-bar{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.pk-bar .m-search{margin:0;flex:1;min-width:160px}
.flt{display:flex;gap:4px;flex-wrap:wrap}
.flt button{font:500 11.5px var(--mono);padding:4px 9px;border-radius:4px;border:1px solid var(--line);color:var(--mute)}
.flt button.on{border-color:var(--blue);color:var(--ink);background:var(--blueSoft)}
.pk-tbl{flex:1;overflow:auto}
.pk-tbl table{width:100%;border-collapse:collapse;font:12.5px var(--mono)}
.pk-tbl th{position:sticky;top:0;background:#0b1830;text-align:left;font-weight:500;color:var(--dim);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;border-bottom:1px solid var(--line)}
.pk-tbl td{padding:7px 12px;border-bottom:1px solid rgba(22,48,79,.6);vertical-align:top}
.pk-tbl td:first-child{color:var(--ok);white-space:nowrap}
.pk-tbl td.sec{color:var(--ice);white-space:nowrap}
.pk-tbl td.use{color:var(--mute);font-family:var(--sans)}
.pk-foot{font:11.5px var(--mono);color:var(--dim);padding:7px 12px;border-top:1px solid var(--line)}

/* ---------- certs ---------- */
.ct-view{padding:18px;display:grid;gap:14px;align-content:start}
.ct-img{border-radius:8px;overflow:hidden;border:1px solid var(--line2);background:#fff;max-width:720px}
.ct-img img{display:block;width:100%;height:auto}
.ct-card{max-width:620px;aspect-ratio:1.414;border-radius:8px;border:1px solid var(--line2);padding:clamp(16px,4%,34px);display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(ellipse at 85% 0%,rgba(61,139,255,.22),transparent 55%),linear-gradient(160deg,#0e203f,#081428);position:relative;overflow:hidden}
.ct-card::after{content:'';position:absolute;right:-40px;bottom:-40px;width:180px;height:180px;border:1px solid rgba(114,214,255,.15);border-radius:50%;box-shadow:0 0 0 22px rgba(114,214,255,.04)}
.ct-card .t{font:600 clamp(18px,3.4vw,26px)/1.15 var(--display);text-wrap:balance}
.ct-card .nm{font:500 15px var(--sans);color:var(--ice)}
.ct-card .ft{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:11.5px var(--mono);color:var(--mute)}
.ct-facts{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px;max-width:620px}
.ct-facts dt{font:12px var(--mono);color:var(--dim)}
.ct-facts dd{margin:0}

/* ---------- contact ---------- */
.cn{padding:18px 20px;display:grid;gap:14px;align-content:start}
.cn-rows{display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cn-row{display:grid;grid-template-columns:22px 82px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.cn-row:first-child{border-top:0}
.cn-row .ic{width:17px;height:17px;color:var(--ice)}
.cn-row span{font:11px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.cn-row .v{font:13px var(--mono);min-width:0;overflow-wrap:anywhere;user-select:all}
.cn-row .v a{user-select:auto}
.cn-row button{font:11.5px var(--mono);padding:3px 9px;border-radius:4px;border:1px solid var(--line2);color:var(--mute)}
.cn-row button:hover{color:var(--ink);border-color:var(--blue)}
.cn textarea{width:100%;min-height:90px;resize:vertical;border-radius:6px;border:1px solid var(--line2);background:var(--deep);padding:10px;outline:0;font-size:13px}
.cn textarea:focus{border-color:var(--blue)}

/* ---------- appearance ---------- */
.st{padding:18px 20px;display:grid;gap:16px;align-content:start}
.wp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.wp-tile{display:flex;flex-direction:column;gap:7px;padding:6px;border-radius:9px;border:1px solid var(--line);background:rgba(4,10,22,.4);text-align:left;cursor:pointer;min-width:0}
.wp-tile:hover{border-color:var(--line2)}
.wp-tile.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.wp-tile canvas,.wp-up{width:100%;aspect-ratio:16/10;border-radius:6px;display:block;background:radial-gradient(ellipse at 70% 30%,#0b1e3e,#081224 45%,#040a15);background-size:cover;background-position:center}
.wp-tile>span{font-size:12.5px;padding:0 3px 2px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.wp-tile .ck{width:18px;height:18px;border-radius:50%;background:var(--blue);color:#04101f;display:none;place-items:center;flex:none}
.wp-tile .ck .ic{width:12px;height:12px;stroke-width:2.6}
.wp-tile.on .ck{display:grid}
.wp-up{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px dashed var(--line2);color:var(--mute);font-size:11.5px;text-align:center;padding:6px}
.wp-up .ic{width:22px;height:22px;color:var(--ice)}
.wp-up b{color:var(--ink);font-weight:500;font-size:12.5px}
.wp-chg{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:5px;background:rgba(4,10,22,.8);color:var(--ink);font-size:12px}
.wp-chg .ic{width:14px;height:14px}
.st-rows{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.st-rows .tog:first-child{border-top:0}
.tog small{display:block;color:var(--mute);font-size:12px}
.tog input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:11px;background:var(--line2);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.tog input::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .2s}
.tog input:checked{background:var(--blue)}
.tog input:checked::after{transform:translateX(16px)}
#desk.custom{background-size:cover;background-position:center;background-repeat:no-repeat}

/* ---------- codelab ---------- */
.cl{display:grid;grid-template-columns:minmax(260px,42%) 1fr;height:100%;min-height:0}
.cl>section{min-width:0;min-height:0;display:flex;flex-direction:column}
.cl-left{border-right:1px solid var(--line);background:rgba(4,10,22,.35)}
.cl-tabs{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);flex:none;background:rgba(4,10,22,.55);flex-wrap:wrap}
.cl-tabs button{padding:5px 11px;border-radius:5px;font-size:12.5px;color:var(--mute);font-weight:500}
.cl-tabs button:hover{color:var(--ink)}
.cl-tabs button.on{background:var(--blueSoft);color:var(--ink)}
.cl-tabs .sp{margin-left:auto;font:11px var(--mono);color:var(--dim);padding:0 4px}
.cl-lbody{flex:1;overflow:auto;padding:16px 18px;min-height:0}
.cl-title{font:600 19px/1.25 var(--display);margin:0 0 8px;text-wrap:balance;letter-spacing:.01em}
.diff{font:600 11px var(--mono);padding:2px 9px;border-radius:10px;white-space:nowrap}
.diff.Easy{color:var(--ok);background:rgba(69,216,147,.12)}
.diff.Medium{color:var(--warn);background:rgba(255,184,77,.12)}
.cl-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.cl-desc p{margin:0 0 10px;max-width:68ch;font-size:13.5px}
.cl-desc code,.cons code{font:12px var(--mono);background:rgba(61,139,255,.12);color:#cfe0ff;padding:1px 5px;border-radius:4px}
.ex{margin:12px 0}
.ex b{font:600 13px var(--display);letter-spacing:.03em}
.ex pre{margin:6px 0 0;padding:10px 12px;border-left:2px solid var(--line2);background:rgba(3,8,18,.6);font:12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--mute)}
.ex pre span{color:var(--ink);font-weight:600}
.cl-lbody h4{font:600 13px var(--display);letter-spacing:.03em;margin:16px 0 6px}
.cons{margin:0;padding-left:18px;font-size:13px;color:var(--mute);display:grid;gap:4px}
.pl{display:grid}
.pl button{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
.pl button:hover{background:rgba(61,139,255,.07)}
.pl button.on{background:rgba(61,139,255,.13)}
.pl .st-ic{width:16px;height:16px;color:var(--ok);stroke-width:2.4}
.pl .st-no{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dim);margin-left:3px}
.pl small{display:block;color:var(--dim);font:11px var(--mono)}
.cl-tool{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;background:rgba(4,10,22,.55)}
.cl-tool select{height:28px;border-radius:5px;border:1px solid var(--line2);background:var(--deep);padding:0 6px;font-size:12.5px}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;gap:6px}
.btn.sm .ic{width:13px;height:13px}
.btn.sub{background:var(--ok);border-color:var(--ok);color:#03140b}
.btn.sub:hover{background:#62e4a6;border-color:#62e4a6}
.btn:disabled{opacity:.5;cursor:wait}
.ed{flex:1;min-height:170px;display:flex;background:#030812;font:13px/1.6 var(--mono);overflow:hidden}
.ed-gut{width:44px;flex:none;padding:10px 8px 10px 0;text-align:right;color:var(--dim);overflow:hidden;user-select:none;white-space:pre;border-right:1px solid rgba(22,48,79,.7);font-variant-numeric:tabular-nums}
.ed-wrap{position:relative;flex:1;min-width:0}
.ed-hl,.ed-ta{position:absolute;inset:0;margin:0;padding:10px 14px;font:inherit;line-height:inherit;white-space:pre;tab-size:4;border:0;overflow:auto;letter-spacing:0;word-spacing:0}
.ed-hl{pointer-events:none;color:var(--ink);overflow:hidden}
.ed-ta{background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--ice);resize:none;outline:0}
.ed-ta::selection{background:rgba(61,139,255,.38)}
.tk-k{color:#7aa8ff}.tk-s{color:#9fe3b9}.tk-n{color:#ffcf8a}.tk-c{color:#5a739b;font-style:italic}.tk-f{color:#72d6ff}.tk-b{color:#c9a8ff}
.cl-con{flex:none;height:40%;min-height:150px;display:flex;flex-direction:column;border-top:1px solid var(--line2)}
.cl-cbody{flex:1;overflow:auto;padding:12px 14px;font-size:13px;min-height:0}
.verdict-h{font:600 18px var(--display);letter-spacing:.02em;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.verdict-h small{font:12px var(--mono);color:var(--mute);font-weight:400;letter-spacing:0}
.v-ok{color:var(--ok)}.v-bad{color:var(--crit)}.v-warn{color:var(--warn)}
.cases{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cases button{padding:4px 11px;border-radius:5px;font-size:12px;background:rgba(255,255,255,.04);color:var(--mute);display:inline-flex;gap:7px;align-items:center}
.cases button.on{background:rgba(61,139,255,.18);color:var(--ink)}
.cases i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.cases i.f{background:var(--crit)}
.io{display:grid;gap:8px}
.io label{font:11px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:3px}
.io pre{margin:0;padding:8px 10px;border-radius:6px;background:rgba(3,8,18,.7);font:12.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:140px;overflow:auto}
.err-pre{margin:0;padding:10px 12px;border-radius:6px;background:rgba(255,92,112,.08)!important;color:#ffb3bd;font:12.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
.cl-pending{color:var(--mute);font:12.5px var(--mono);display:flex;gap:10px;align-items:center}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--ice);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- small screens ---------- */
@media (max-width:760px){
  .win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;resize:none}
  .tb{cursor:default}
  .icons{right:16px;grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));grid-auto-rows:88px;align-content:start;bottom:auto}
  .dicon{width:auto}
  .sigil-bg{right:50%;transform:translate(50%,-10%);top:auto;bottom:6%;width:60vw}
  .pbtn.brand b,.hide-sm{display:none}
  .split,.cy-main,.fx{grid-template-columns:1fr;height:auto}
  .side,.cy-left,.fx-side{border-right:0;border-left:0;border-bottom:1px solid var(--line)}
  .av{grid-template-columns:1fr;grid-template-rows:minmax(260px,55%) 1fr}
  .av-side{border-left:0;border-top:1px solid var(--line)}
  .edu>div{grid-template-columns:1fr auto}
  .edu .yr{grid-column:1/-1}
  .wall-tag{display:none}
  .cl{grid-template-columns:1fr;height:auto}
  .cl-left{border-right:0;border-bottom:1px solid var(--line)}
  .cl-lbody{max-height:none}
  .ed{min-height:320px}
  .cl-con{height:auto;min-height:220px}
  .cl-tabs .sp{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

</head>
<body>
<div id="boot" aria-hidden="true"><div id="bootlog"></div><span class="skip">click or press any key to skip</span></div>
<div id="lock" hidden></div>

<div id="os">
  <header class="panel" role="toolbar" aria-label="Panel">
    <button class="pbtn brand" id="menuBtn" aria-haspopup="true" aria-label="Applications menu"><span class="av-hex" style="width:20px;height:20px" data-sigil></span><b>KhadpeOS</b></button>
    <span class="psep"></span>
    <button class="pbtn" data-open="terminal" title="Terminal (Ctrl+Alt+T)" aria-label="Terminal"><svg class="ic"><use href="#i-terminal"/></svg></button>
    <button class="pbtn" data-open="files" title="Projects" aria-label="Projects"><svg class="ic"><use href="#i-folder"/></svg></button>
    <button class="pbtn" data-open="codelab" title="CodeLab" aria-label="CodeLab"><svg class="ic"><use href="#i-braces"/></svg></button>
    <button class="pbtn hide-sm" data-open="cypheron" title="Cypheron" aria-label="Cypheron"><svg class="ic"><use href="#i-shield"/></svg></button>
    <span class="psep"></span>
    <nav class="tasks" id="tasks" aria-label="Open windows"></nav>
    <div class="tray">
      <span class="pbtn hide-sm" title="Connected · wlan0" aria-label="Network connected"><svg class="ic"><use href="#i-wifi"/></svg></span>
      <span class="clock" id="clock">--:--</span>
      <button class="pbtn" id="lockBtn" title="Lock screen" aria-label="Lock screen"><svg class="ic"><use href="#i-lock"/></svg></button>
    </div>
  </header>
  <main id="desk">
    <canvas id="wall" aria-hidden="true"></canvas>
    <div class="sigil-bg" data-sigil aria-hidden="true"></div>
    <div class="wall-tag" aria-hidden="true"><b>KHADPE OS</b>the quieter you become, the more you are able to hear</div>
    <div class="icons" id="icons"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
  </main>
</div>
<div id="menu" hidden></div>
<div id="ctx" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12.5 15h4.5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>

self.onmessage=e=>{

  try{console.log=console.info=console.warn=console.error=console.debug=log}catch(err){}
  let f;
  try{f=(new Function(code+'\n;return typeof '+fn+'==="function"?'+fn+':null;'))()}catch(err){postMessage({compileError:String(err)});return}
  if(!f){postMessage({compileError:'Function '+fn+' is not defined. Keep the starter signature.'});return}

  for(const args of tests){cur=[];const t0=performance.now();
    try{let out=f(...JSON.parse(JSON.stringify(args)));const ms=performance.now()-t0;out=out===undefined?null:JSON.parse(JSON.stringify(out));res.push({out,ms,logs:cur})}
    catch(err){res.push({err:String(err),ms:performance.now()-t0,logs:cur})}}
  postMessage({res});
};

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,cls='ic')=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const isMobile=()=>matchMedia('(max-width:760px)').matches;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
const rng=seed=>()=>{seed=(seed+0x6D2B79F5)|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
async function copy(text,btn){
  try{await navigator.clipboard.writeText(text);if(btn){const o=btn.textContent;btn.textContent='copied';setTimeout(()=>btn.textContent=o,1300)}}
  catch(e){const r=document.createRange();const el=btn&&btn.previousElementSibling;if(el){r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}if(btn)btn.textContent='select + copy'}
}

const WM={wins:new Map(),z:20,n:0};
const desk=$('#desk');
function openApp(id,arg,pos){
  const app=APPS[id]; if(!app) return null;
  closeMenu(); closeCtx();
  let rec=WM.wins.get(id);
  if(rec){rec.el.hidden=false;rec.min=false;focusWin(id);if(arg!=null&&rec.api&&rec.api.arg)rec.api.arg(arg);renderTasks();return rec}
  const el=document.createElement('section');
  el.className='win';el.dataset.app=id;el.setAttribute('role','dialog');el.setAttribute('aria-label',app.title);
  const dw=desk.clientWidth,dh=desk.clientHeight;
  const W=Math.min(app.w,dw-24),H=Math.min(app.h,dh-24);
  const off=(WM.n++%6)*28;
  let x=pos?pos[0]:Math.max(12,Math.min(dw-W-12,(dw-W)/2-70+off+60));

/* ================= wallpaper engine ================= */
const WP_MODES={
  nodes:{name:'Network · Deep Blue',col:[61,139,255]},
  ice:{name:'Network · Ice',col:[114,214,255]},
  rain:{name:'Code Rain',opaque:true},
  horizon:{name:'Horizon Grid',opaque:true},
  aurora:{name:'Aurora',opaque:true},
  midnight:{name:'Midnight',opaque:true,still:true}
};
const GLYPHS='01{}[]<>/=;:$#ABCDEF0123456789アイウエオカキクケコｱｲｳ';
function wpInit(mode,w,h){
  const R=rng(7);
  if(mode==='nodes'||mode==='ice'){const n=Math.round(Math.min(90,Math.max(16,w*h/16000)));return{nodes:Array.from({length:n},()=>({x:R()*w,y:R()*h,vx:(R()-.5)*.18,vy:(R()-.5)*.18,r:R()*1.6+.6}))}}
  if(mode==='rain'){const fs=w<400?8:15,cols=Math.ceil(w/fs);return{fs,first:true,acc:0,drops:Array.from({length:cols},()=>R()*h/fs-R()*h/fs),sp:Array.from({length:cols},()=>.35+R()*.65)}}
  if(mode==='horizon')return{t:0,stars:Array.from({length:70},()=>[R()*w,R()*h*.55,R()])};
  if(mode==='aurora')return{t:3};
  return{};
}
function wpFrame(mode,c,s,w,h,dt){
  if(mode==='nodes'||mode==='ice'){
    const [r,g,b]=WP_MODES[mode].col,k=dt*60;
    for(const a of s.nodes){a.x+=a.vx*k;a.y+=a.vy*k;if(a.x<0||a.x>w)a.vx*=-1;if(a.y<0||a.y>h)a.vy*=-1}
    c.clearRect(0,0,w,h);const L=Math.min(150,Math.max(60,w/8));
    for(let i=0;i<s.nodes.length;i++){const a=s.nodes[i];for(let j=i+1;j<s.nodes.length;j++){const o=s.nodes[j],dx=a.x-o.x,dy=a.y-o.y,d=dx*dx+dy*dy;
      if(d<L*L){c.strokeStyle=`rgba(${r},${g},${b},${.16*(1-Math.sqrt(d)/L)})`;c.lineWidth=1;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(o.x,o.y);c.stroke()}}}
    c.fillStyle=`rgba(${r},${g},${b},.55)`;for(const a of s.nodes){c.beginPath();c.arc(a.x,a.y,a.r,0,7);c.fill()}
    return;
  }
  if(mode==='rain'){
    if(s.first){c.fillStyle='#040a15';c.fillRect(0,0,w,h);s.first=false}
    s.acc+=dt;if(s.acc<.05)return;const step=Math.min(3,s.acc*20);s.acc=0;
    c.fillStyle='rgba(4,10,21,.13)';c.fillRect(0,0,w,h);
    c.font=s.fs+'px "IBM Plex Mono", monospace';
    for(let i=0;i<s.drops.length;i++){const y=s.drops[i]*s.fs;
      c.fillStyle=Math.random()<.05?'rgba(220,236,255,.95)':'rgba(61,139,255,.8)';
      c.fillText(GLYPHS[(Math.random()*GLYPHS.length)|0],i*s.fs,y);
      s.drops[i]+=s.sp[i]*step;if(y>h&&Math.random()>.975)s.drops[i]=0}
    return;
  }
  if(mode==='horizon'){
    s.t+=dt;const hy=h*.6;
    const sky=c.createLinearGradient(0,0,0,hy);sky.addColorStop(0,'#02060e');sky.addColorStop(1,'#0c2350');c.fillStyle=sky;c.fillRect(0,0,w,hy);
    for(const [x,y,b] of s.stars){c.fillStyle=`rgba(180,215,255,${.25+.45*b*(.6+.4*Math.sin(s.t*1.5+x))})`;c.fillRect(x,y,1.4,1.4)}
    const glow=c.createRadialGradient(w/2,hy,0,w/2,hy,Math.max(w,h)*.45);glow.addColorStop(0,'rgba(61,139,255,.45)');glow.addColorStop(1,'rgba(61,139,255,0)');c.fillStyle=glow;c.fillRect(0,0,w,h);
    c.fillStyle='#030914';c.fillRect(0,hy,w,h-hy);
    c.save();c.beginPath();c.rect(0,hy,w,h-hy);c.clip();
    c.lineWidth=1;
    for(let i=-24;i<=24;i++){c.strokeStyle=`rgba(61,139,255,${.5-Math.abs(i)*.012})`;c.beginPath();c.moveTo(w/2+i*w*.004,hy);c.lineTo(w/2+i*w*.09,h);c.stroke()}
    const off=(s.t*.35)%1;
    for(let k=0;k<18;k++){const z=(k+off)/18,y=hy+(h-hy)*Math.pow(z,2.4);c.strokeStyle=`rgba(114,214,255,${.08+z*.5})`;c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}
    c.restore();
    c.strokeStyle='rgba(150,220,255,.9)';c.lineWidth=1.5;c.beginPath();c.moveTo(0,hy);c.lineTo(w,hy);c.stroke();
    return;
  }
  if(mode==='aurora'){
    s.t+=dt*.12;c.fillStyle='#030813';c.fillRect(0,0,w,h);
    c.globalCompositeOperation='lighter';
    [[61,139,255,.3,.2],[114,214,255,.16,1.7],[95,85,255,.22,3.1]].forEach(([r,g,b,a,p],i)=>{
      const x=w*(.5+.38*Math.sin(s.t*(.7+i*.2)+p)),y=h*(.45+.3*Math.cos(s.t*(.5+i*.15)+p*1.3)),R=Math.max(w,h)*(.45+.08*i);
      const gr=c.createRadialGradient(x,y,0,x,y,R);gr.addColorStop(0,`rgba(${r},${g},${b},${a})`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);c.fillStyle=gr;c.fillRect(0,0,w,h)});
    c.globalCompositeOperation='source-over';
    c.fillStyle='rgba(114,214,255,.05)';for(let x=14;x<w;x+=28)for(let y=14;y<h;y+=28)c.fillRect(x,y,1.2,1.2);
    return;
  }
  if(mode==='midnight'){
    const g=c.createLinearGradient(0,0,w,h);g.addColorStop(0,'#0a1d3d');g.addColorStop(1,'#02060e');c.fillStyle=g;c.fillRect(0,0,w,h);
    const r=c.createRadialGradient(w*.28,h*.22,0,w*.28,h*.22,Math.max(w,h)*.6);r.addColorStop(0,'rgba(61,139,255,.28)');r.addColorStop(1,'rgba(61,139,255,0)');c.fillStyle=r;c.fillRect(0,0,w,h);
    c.fillStyle='rgba(114,214,255,.09)';const st=Math.max(10,Math.round(w/50));for(let x=st/2;x<w;x+=st)for(let y=st/2;y<h;y+=st)c.fillRect(x,y,1.2,1.2);
  }
}
function wpPrime(mode,c,s,w,h){const n=mode==='rain'?160:1;for(let i=0;i<n;i++)wpFrame(mode,c,s,w,h,.05)}

const WALL={mode:'nodes',motion:!reduced,sigil:true,custom:null};
try{Object.assign(WALL,JSON.parse(localStorage.getItem('kos.wall')||'{}'))}catch(e){}
if(WALL.mode==='custom'&&!WALL.custom)WALL.mode='nodes';
if(!WP_MODES[WALL.mode]&&WALL.mode!=='custom')WALL.mode='nodes';
const wallCv=$('#wall'),wallCx=wallCv.getContext('2d');let wallSt=null,wallW=0,wallH=0,wallLast=performance.now();
function wallSize(){const d=Math.min(devicePixelRatio||1,2);wallW=desk.clientWidth;wallH=desk.clientHeight;wallCv.width=wallW*d;wallCv.height=wallH*d;wallCx.setTransform(d,0,0,d,0,0);
  if(WALL.mode==='custom')return;wallSt=wpInit(WALL.mode,wallW,wallH);wpPrime(WALL.mode,wallCx,wallSt,wallW,wallH)}
function setWall(patch){
  Object.assign(WALL,patch||{});
  const custom=WALL.mode==='custom'&&WALL.custom;
  desk.style.backgroundImage=custom?`url("${WALL.custom}")`:'';desk.classList.toggle('custom',!!custom);
  wallCv.hidden=!!custom;$('.sigil-bg').hidden=!WALL.sigil;

  try{localStorage.setItem('kos.wall',JSON.stringify(WALL))}catch(e){try{localStorage.setItem('kos.wall',JSON.stringify(Object.assign({},WALL,{custom:null,mode:WALL.mode==='custom'?'nodes':WALL.mode})))}catch(e2){}}
  if(window.__refreshSettings)window.__refreshSettings();
}
function wallLoop(now){
  const dt=Math.min(.1,(now-wallLast)/1000);wallLast=now;
  if(!document.hidden&&WALL.motion&&WALL.mode!=='custom'&&wallSt&&!WP_MODES[WALL.mode].still)wpFrame(WALL.mode,wallCx,wallSt,wallW,wallH,dt);
  requestAnimationFrame(wallLoop);
}
new ResizeObserver(()=>wallSize()).observe(desk);
setWall();requestAnimationFrame(wallLoop);

  const finish=()=>{clearInterval(bootTimer);b.classList.add('out');setTimeout(()=>{b.hidden=true},460);document.removeEventListener('keydown',finish);b.onclick=null;start()};
  b.onclick=finish;document.addEventListener('keydown',finish,{once:true});
  bootTimer=setInterval(()=>{if(i>=BOOT.length){finish();return}log.insertAdjacentHTML('beforeend',`<div>${BOOT[i++]}</div>`)},95);
}

function initCypheron(body,rec,arg){
  body.innerHTML=`<div class="cy">
   <form class="cy-bar" id="cy-form"><label class="cy-url">${ic('lock')}<input id="cy-in" value="https://shop.example" aria-label="Target URL"></label><button class="btn pri" type="submit">${ic('play')}Scan</button></form>

   <p class="demo-note">Demo mode: results are simulated in your browser and no request leaves this page. The real Cypheron probes targets with HTTPX + BeautifulSoup and streams progress over WebSockets.</p></div>`;
  const left=$('.cy-left',body),right=$('.cy-right',body),inp=$('#cy-in',body);
  let timer=null;rec.cleanup.push(()=>clearInterval(timer));
  function pick(url){const R=rng(hash(url));const fs=FINDINGS.filter(()=>R()<.55);if(!fs.some(f=>f.sev!=='info'))fs.push(FINDINGS[9]);return fs.sort((a,b)=>SEVW[b.sev]-SEVW[a.sev])}
  function summary(url,fs){
    const top=fs.filter(f=>f.sev==='critical'||f.sev==='high');
    const host=url.replace(/^https?:\/\//,'').split('/')[0];
    if(!top.length)return `${host} has no critical or high-risk issues. The remaining items are hardening steps: ${fs.slice(0,2).map(f=>f.t.toLowerCase()).join(' and ')}. Fix them in one config change and re-scan.`;
    return `Fix "${top[0].t}" first: it is the most direct path to compromise on ${host}. ${top[1]?`Next, address "${top[1].t}". `:''}${fs.length-top.length} lower-severity items are mostly header and cookie hardening and can ship together in one deploy.`;
  }
  function renderLeft(prog,fs,score){
    const cnt=s=>fs?fs.filter(f=>f.sev===s).length:'–';
    const [g,col]=score!=null?gradeOf(score):['…','var(--dim)'];
    left.innerHTML=`<div class="grade"><div class="grade-l" style="color:${col}">${g}</div><div><small>risk score</small><b>${score!=null?score+'/100':'scanning'}</b></div></div>
     <div class="counts">${['critical','high','medium','low','info'].map(s=>`<div><b style="color:${s==='critical'?'var(--crit)':s==='high'?'var(--high)':s==='medium'?'var(--warn)':s==='low'?'var(--ice)':'var(--mute)'}">${cnt(s)}</b><span>${s.slice(0,4)}</span></div>`).join('')}</div>
     <div><div class="eyebrow" style="margin-bottom:6px">modules</div><div class="mods">${MODS.map(([k,n],i)=>{const p=Math.max(0,Math.min(100,(prog-i)*100));return `<div class="mod ${p>=100?'done':''}" style="--p:${p}%"><span>${n}</span><em>${p>=100?(fs?fs.filter(f=>f.m===k).length+' found':'done'):p>0?'running':'queued'}</em><i></i></div>`}).join('')}</div></div>`;
  }
  function renderRight(url,fs,log){
    right.innerHTML=(fs?`<div class="ai-box"><div class="eyebrow">${ic('spark')}AI analysis · Claude</div><p>${esc(summary(url,fs))}</p></div>
      <div class="eyebrow">findings · ${fs.length}</div>
      ${fs.map((f,i)=>`<details class="finding" ${i===0?'open':''}><summary><span class="sev ${f.sev}">${f.sev}</span><b>${esc(f.t)}</b><em>${MODS.find(m=>m[0]===f.m)[1]}</em></summary><div class="fd"><span>${esc(f.d)}</span><span><code>fix ›</code> ${esc(f.f)}</span></div></details>`).join('')}`:'')
      +`<div><div class="eyebrow" style="margin-bottom:6px">ws://localhost:8000/scan · live log</div><div class="cy-log">${log.join('<br>')}</div></div>`;
    const lg=$('.cy-log',right);if(lg)lg.scrollTop=lg.scrollHeight;
  }
  function finished(url){const fs=pick(url);const score=Math.max(0,100-fs.reduce((s,f)=>s+SEVW[f.sev],0));
    const log=[`→ scan ${esc(url)} accepted · id ${hash(url).toString(16).slice(0,8)}`,...MODS.map(([k,n])=>`<span class="g">✓</span> ${n} · ${fs.filter(f=>f.m===k).length} finding(s)`),`→ Claude analysis complete · grade ${gradeOf(score)[0]} · saved to history`];
    renderLeft(MODS.length,fs,score);renderRight(url,fs,log)}
  function scan(url){
    clearInterval(timer);inp.value=url;
    if(reduced){finished(url);return}
    let prog=0;const log=[`→ scan ${esc(url)} accepted · id ${hash(url).toString(16).slice(0,8)}`];
    renderLeft(0,null,null);renderRight(url,null,log);
    const fs=pick(url);
    timer=setInterval(()=>{
      prog+=.25;const done=Math.floor(prog);
      if(prog%1===0&&done<=MODS.length){const [k,n]=MODS[done-1];const ms=120+Math.round(rng(hash(url+k))()*380);log.push(`<span class="g">✓</span> ${n} · ${fs.filter(f=>f.m===k).length} finding(s) · ${ms} ms`)}
      if(prog>=MODS.length){clearInterval(timer);finished(url);return}
      renderLeft(prog,null,null);renderRight(url,null,log);
    },140);
  }
  $('#cy-form',body).addEventListener('submit',e=>{e.preventDefault();let u=inp.value.trim()||'https://shop.example';if(!/^https?:\/\//.test(u))u='https://'+u;scan(u)});
  if(arg)scan(arg);else finished(inp.value);
  return {arg:u=>scan(u)};
}

function initAviai(body,rec){

  const cv=$('canvas',body),cx=cv.getContext('2d'),scope=$('.av-scope',body),strips=$('.av-strips',body),logEl=$('.av-log',body);
  const R=rng(42);const AL=['IGO','AIC','AKJ','AXB','UAE','QTR','SIA','BAW'];
  const mk=(dep)=>{const ang=R()*Math.PI*2;const r=dep?2+R()*4:44+R()*15;const cs=AL[Math.floor(R()*AL.length)]+(100+Math.floor(R()*8900));
    const toC=Math.atan2(-Math.sin(ang),-Math.cos(ang));const hdg=dep?ang+(R()-.5)*.6:toC+(R()-.5)*.5;
    return {cs,x:Math.cos(ang)*r,y:Math.sin(ang)*r,hdg,spd:dep?180+R()*90:230+R()*60,alt:dep?3000+Math.floor(R()*5)*1000:12000+Math.floor(R()*14)*1000,dep,lit:0}};
  let planes=Array.from({length:9},(_,i)=>mk(i%3===0));
  let sweep=0,last=performance.now(),raf=0,size=300;
  const toHdg=a=>((Math.round(90-a*180/Math.PI)%360)+360)%360||360;
  function resize(){const r=scope.getBoundingClientRect();const d=Math.min(devicePixelRatio||1,2);cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0);size=Math.min(r.width,r.height)}
  const ro=new ResizeObserver(resize);ro.observe(scope);resize();
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    const w=cv.width/Math.min(devicePixelRatio||1,2),h=cv.height/Math.min(devicePixelRatio||1,2),cxp=w/2,cyp=h/2,rad=size/2-18,k=rad/60;
    sweep=(sweep+dt*1.1)%(Math.PI*2);
    for(const p of planes){const v=p.spd/3600*40;p.x+=Math.cos(p.hdg)*v*dt;p.y+=Math.sin(p.hdg)*v*dt;
      if(!p.dep){const toC=Math.atan2(-p.y,-p.x);let d=toC-p.hdg;d=Math.atan2(Math.sin(d),Math.cos(d));p.hdg+=d*dt*.08}
      const r=Math.hypot(p.x,p.y);if((!p.dep&&r<2.5)||(p.dep&&r>60))Object.assign(p,mk(!p.dep));
      const a=((Math.atan2(p.y,p.x))%(Math.PI*2)+Math.PI*2)%(Math.PI*2);let diff=(sweep-a+Math.PI*2)%(Math.PI*2);if(diff<.06)p.lit=1;else p.lit=Math.max(.25,p.lit-dt*.22)}
    cx.clearRect(0,0,w,h);
    cx.strokeStyle='rgba(61,139,255,.28)';cx.lineWidth=1;cx.font='10px IBM Plex Mono, monospace';cx.fillStyle='rgba(114,214,255,.55)';
    for(let n=15;n<=60;n+=15){cx.beginPath();cx.arc(cxp,cyp,n*k,0,7);cx.stroke();cx.fillText(n+'NM',cxp+n*k*.71+3,cyp-n*k*.71-3)}
    cx.beginPath();cx.moveTo(cxp-rad,cyp);cx.lineTo(cxp+rad,cyp);cx.moveTo(cxp,cyp-rad);cx.lineTo(cxp,cyp+rad);cx.strokeStyle='rgba(61,139,255,.14)';cx.stroke();
    for(let d=0;d<360;d+=30){const a=(90-d)*Math.PI/180;cx.fillText(String(d).padStart(3,'0'),cxp+Math.cos(a)*(rad+4)-9,cyp-Math.sin(a)*(rad+4)+4)}
    cx.strokeStyle='#72d6ff';cx.lineWidth=3;cx.beginPath();cx.moveTo(cxp-7,cyp+3);cx.lineTo(cxp+7,cyp-3);cx.stroke();
    const g=cx.createRadialGradient(cxp,cyp,0,cxp,cyp,rad);g.addColorStop(0,'rgba(61,139,255,.0)');g.addColorStop(1,'rgba(61,139,255,.22)');
    cx.save();cx.beginPath();cx.moveTo(cxp,cyp);cx.arc(cxp,cyp,rad,-sweep,-sweep+.5);cx.closePath();cx.fillStyle=g;cx.fill();cx.restore();
    cx.strokeStyle='rgba(114,214,255,.8)';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(cxp,cyp);cx.lineTo(cxp+Math.cos(-sweep)*rad,cyp+Math.sin(-sweep)*rad);cx.stroke();
    for(const p of planes){const X=cxp+p.x*k,Y=cyp-p.y*k;const col=p.dep?'69,216,147':'114,214,255';
      cx.fillStyle=`rgba(${col},${p.lit})`;cx.fillRect(X-3,Y-3,6,6);
      cx.strokeStyle=`rgba(${col},${p.lit*.6})`;cx.lineWidth=1;cx.beginPath();cx.moveTo(X,Y);cx.lineTo(X+Math.cos(p.hdg)*16,Y-Math.sin(p.hdg)*16);cx.stroke();
      cx.fillStyle=`rgba(220,232,248,${.35+p.lit*.6})`;cx.fillText(p.cs,X+7,Y-6);cx.fillStyle=`rgba(139,162,195,${.3+p.lit*.5})`;cx.fillText(String(Math.round(p.alt/100)).padStart(3,'0')+' '+Math.round(p.spd),X+7,Y+5)}
    raf=requestAnimationFrame(frame);
  }
  function renderStrips(){strips.innerHTML=planes.slice().sort((a,b)=>Math.hypot(a.x,a.y)-Math.hypot(b.x,b.y)).map(p=>`<div class="strip ${p.dep?'dep':''}"><b>${p.cs}</b><span>${p.dep?'DEP':'ARR'} ${Math.round(Math.hypot(p.x,p.y))}NM</span><span>FL${String(Math.round(p.alt/100)).padStart(3,'0')}</span></div>`).join('');$('.av-n',body).textContent=planes.length+' tracks'}

  }

  raf=requestAnimationFrame(frame);
  const iv=setInterval(()=>{if(!document.hidden)clearance()},2800);
  const sv=setInterval(renderStrips,1500);
  rec.cleanup.push(()=>{cancelAnimationFrame(raf);clearInterval(iv);clearInterval(sv);ro.disconnect()});
}

const STOP=new Set('a an the of to in on for and or is are be can i my me do does how what who with by under per as at from it this that much'.split(' '));
const tok=s=>(s.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(w=>!STOP.has(w));
const tri=s=>{const v=new Map();const t=' '+s.toLowerCase().replace(/[^a-z0-9 ]/g,' ')+' ';for(let i=0;i<t.length-2;i++){const g=t.slice(i,i+3);v.set(g,(v.get(g)||0)+1)}return v};
const cos=(a,b)=>{let d=0,na=0,nb=0;a.forEach((x,k)=>{na+=x*x;if(b.has(k))d+=x*b.get(k)});b.forEach(x=>nb+=x*x);return d/Math.sqrt(na*nb||1)};
const DOCS=CORPUS.map(c=>{const t=tok(c.text+' '+c.kw);return{t,tf:t.reduce((m,w)=>(m[w]=(m[w]||0)+1,m),{}),v:tri(c.text+' '+c.kw)}});
const AVG=DOCS.reduce((s,d)=>s+d.t.length,0)/DOCS.length;
const DF={};DOCS.forEach(d=>new Set(d.t).forEach(w=>DF[w]=(DF[w]||0)+1));
function retrieve(q){
  const qt=tok(q),qv=tri(q),N=DOCS.length,k1=1.4,b=.75;
  const rows=DOCS.map((d,i)=>{let bm=0;for(const w of qt){const f=d.tf[w]||0;if(!f)continue;const idf=Math.log(1+(N-DF[w]+.5)/(DF[w]+.5));bm+=idf*f*(k1+1)/(f+k1*(1-b+b*d.t.length/AVG))}return{i,bm,de:cos(qv,d.v)}});
  const mx=Math.max(...rows.map(r=>r.bm),1e-9),dmx=Math.max(...rows.map(r=>r.de)),dmn=Math.min(...rows.map(r=>r.de));
  rows.forEach(r=>{r.h=.55*(r.bm/mx)+.45*((r.de-dmn)/((dmx-dmn)||1))});
  return rows.sort((a,b)=>b.h-a.h);
}

function diagram(d){
  const H=40,W=780,maxY=Math.max(...d.nodes.map(n=>n.y))+H+30;
  const N={};d.nodes.forEach(n=>N[n.id]=n);
  const anchor=(a,b)=>{const ac={x:a.x+a.w/2,y:a.y+H/2},bc={x:b.x+b.w/2,y:b.y+H/2};const dx=bc.x-ac.x,dy=bc.y-ac.y;
    if(Math.abs(dx)>Math.abs(dy)*1.2){const s=Math.sign(dx);return[{x:s>0?a.x+a.w:a.x,y:ac.y},{x:s>0?b.x:b.x+b.w,y:bc.y},'h']}
    const s=Math.sign(dy)||1;return[{x:ac.x,y:s>0?a.y+H:a.y},{x:bc.x,y:s>0?b.y:b.y+H},'v']};
  const seen={};
  const edges=d.edges.map(([a,b,l])=>{const key=[a,b].sort().join();const off=seen[key]?8:0;seen[key]=1;
    let [p,q,o]=anchor(N[a],N[b]);if(o==='h'){p.y+=off;q.y+=off}else{p.x+=off;q.x+=off}
    const path=o==='h'?`M${p.x},${p.y} C${(p.x+q.x)/2},${p.y} ${(p.x+q.x)/2},${q.y} ${q.x},${q.y}`:`M${p.x},${p.y} C${p.x},${(p.y+q.y)/2} ${q.x},${(p.y+q.y)/2} ${q.x},${q.y}`;
    const mx=(p.x+q.x)/2,my=(p.y+q.y)/2;
    return `<path class="dg-edge" d="${path}" marker-end="url(#arr)"/>${l?`<text class="dg-lbl" x="${mx+(o==='v'?6:0)}" y="${my-(o==='h'?5:0)}" text-anchor="${o==='v'?'start':'middle'}">${esc(l)}</text>`:''}`}).join('');
  const nodes=d.nodes.map(n=>`<g class="dg-node ${n.k?'k-'+n.k:''}"><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${H}" rx="6"/><text x="${n.x+10}" y="${n.y+17}">${esc(n.l)}</text><text class="s" x="${n.x+10}" y="${n.y+31}">${esc(n.s)}</text></g>`).join('');
  return `<svg viewBox="0 -10 ${W} ${maxY+10}" role="img" aria-label="${esc(d.title)} architecture"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d8bff"/></marker></defs>${edges}${nodes}</svg>`;
}
